; Skyrim SE Head Tracking Configuration
; Delete this file to reset to defaults

[Network]
; UDP port for OpenTrack data (default: 4242)
UDPPort=4242

[Sensitivity]
; Rotation sensitivity multipliers (1.0 = 1:1)
YawMultiplier=1
PitchMultiplier=1
RollMultiplier=1
; Smoothing, applied to both rotation and position. The value is picked
; per connection from the packet source address.
; LocalSmoothing: tracker running on this machine (loopback).
; RemoteSmoothing: tracker on a remote network device (phone on WiFi).
; 0.0 = no smoothing, 1.0 = heavy. Raise for a noisier tracker - it
; costs perceived latency.
LocalSmoothing=0
RemoteSmoothing=0.15

[Position]
; Position tracking sensitivity (0.1-10.0, higher = more movement)
SensitivityX=1
SensitivityY=1
SensitivityZ=1
; Position limits in meters (how far the camera can move)
LimitX=0.3
LimitY=0.2
LimitZ=0.4
; Backward lean limit (prevents camera clipping through player model)
LimitZBack=0.1
; Invert position axes
InvertX=true
InvertY=false
InvertZ=true
; Enable/disable position tracking (6DOF)
Enabled=true

[Hotkeys]
; Virtual key codes (hex)
ToggleKey=0x23    ; End - Enable/disable
PositionToggleKey=0x21 ; Page Up - Toggle position
YawModeKey=0x22        ; Page Down - Toggle world/local yaw

[General]
; Auto-enable tracking on game start
AutoEnable=true
; Show on-screen notifications (logged to HeadTracking.log)
ShowNotifications=true
; Yaw mode: true = horizon-locked (default), false = camera-local
WorldSpaceYaw=true

[Crosshair]
; Reposition the game's native crosshair to follow your aim once
; head tracking moves the view. Set false to leave it at centre.
Show=true
